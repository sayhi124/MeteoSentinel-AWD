server:
  port: 8180
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  application:
    name: api-gateway
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://127.0.0.1:8889}"
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: weather-service
              uri: lb://weather-service
              predicates:
                - Path=/api/weather,/api/weather/**
            - id: forecast-service
              uri: lb://forecast-service
              predicates:
                - Path=/api/forecasts,/api/forecasts/**
            - id: alert-service
              uri: lb://alert-service
              predicates:
                - Path=/api/alerts,/api/alerts/**
            - id: air-quality-service
              uri: lb://air-quality-service
              predicates:
                - Path=/api/air-quality,/api/air-quality/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users,/api/users/**
            - id: activity-service
              uri: lb://activity-service
              predicates:
                - Path=/api/activities,/api/activities/**
            - id: datahub-service
              uri: lb://datahub-service
              predicates:
                - Path=/api/datahub,/api/datahub/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://127.0.0.1:8762/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_IP:127.0.0.1}
security:
  issuer: ${OIDC_ISSUER:http://localhost:8088/realms/meteosentinel}
  jwk-set-uri: ${OIDC_JWKS:http://localhost:8088/realms/meteosentinel/protocol/openid-connect/certs}
management:
  endpoints:
    web:
      exposure:
        include: health,info
