server:
  port: 8762
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  application:
    name: eureka-server
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
